# 三端演示 Demo · 容器内静态站
#
# 三入口：index（端选择页）/ pc.html（网页端，history 路由）/ mobile.html（移动端，hash 路由）。
#
# 深链回退规则必须与 scripts/serve.mjs 逐条一致 —— 历史上这里踩过坑：
# 把无扩展名路径统一回退到 index.html，刷新 PC 深链会掉回端选择页，看起来像「登录态丢了」。
# 现行规则：/ → index.html ；其余无扩展名路径 → pc.html ；带扩展名但缺失必须 404
# （把缺失的 /assets/*.js 回退成 HTML，浏览器会拿 HTML 当 ES 模块解析 → 整页白屏）。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 不回显 nginx 版本号，减少指纹信息（演示站公网可达）
  server_tokens off;

  # 认证已收敛到站内登录页（纯「账号 + 密码」两字段，见 hrm-demo 登录页）：
  # 原先容器内叠的 Basic Auth 网关已移除，避免「先过网关、再登站内」两层验身。
  # 代价：演示站自此对公网完全开放（站内仅演示 Mock 数据，无任何真实业务数据）。

  # 健康检查探针（不鉴权，否则容器 healthcheck 恒 401 被误判为不健康）
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 入口 HTML 必须禁缓存：它引用带内容哈希的 chunk 名，缓存住会出现「新页面引用旧 chunk」
  # 该条必须排在下面通用扩展名规则之前（nginx 正则 location 按出现顺序匹配）
  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  # 构建产物带 8 位以上内容哈希 → 可长缓存
  # 注意：正则必须加双引号 —— nginx 在分词阶段就会把裸正则里的 `{` 当成配置块起始符，
  # 写成 -[A-Za-z0-9_-]{8,} 会直接报 unknown directive（已实测踩过）
  location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 生产 source map 严禁对公网暴露（项目规则 D 档红线：不得把生产 *.map 部署为可公开访问）。
  # 构建产出 hidden 源映射（JS 内部不写 sourceMappingURL），但 .map 文件本身仍会被下面的
  # 通用扩展名规则命中而可被直接下载 —— 故此处显式拦截。
  # 必须排在通用规则之前：nginx 的正则 location 按出现顺序匹配，顺序颠倒则拦截失效。
  location ~* \.map$ {
    return 404;
  }

  # 其余带扩展名的静态资源：命中即给，缺失必须 404（不得回退成 HTML）
  location ~* \.[A-Za-z0-9]+$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # 根路径 → 端选择页
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
  }

  # 其余无扩展名路径 → 网页端入口（三个入口里只有网页端用 history 路由）
  location / {
    try_files $uri /pc.html;
    add_header Cache-Control "no-store" always;
  }
}
