<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 内联 SVG data-URI favicon（品牌色 700 档 #0958D9 的包裹标识）：不引入二进制资源，同时消除 /favicon.ico 的 404 请求 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230958D9'/%3E%3Cpath%20d='M9%2013l7-3.5%207%203.5v7L16%2023.5%209%2020z'%20fill='%23fff'/%3E%3Cpath%20d='M16%209.5v14'%20stroke='%230958D9'%20stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <!-- 安卓 H5 壳内嵌页面：禁用缩放与双击放大，符合移动端使用习惯（Vant 官方适配建议） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>移动端 · 快递驿站智汇系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile/main.js"></script>
  </body>
</html>
